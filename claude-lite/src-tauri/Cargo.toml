[package]
name = "claude-lite"
version = "0.1.0"
description = "Hafif Claude API masaüstü istemcisi"
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "process", "io-util"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
mime_guess = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1
debug = 1
incremental = true
